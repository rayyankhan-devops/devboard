name: devboard CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  install-and-test-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22' , '20' , '19']
        go-version: ['1.24', '1.25', '1.26']
    steps:
      - name: cloning code
        uses: actions/checkout@v4
        
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: Run lint
        run: npm run lint
        working-directory: frontend

      - name: Run tests
        run: npm test
        working-directory: frontend

          
  install-and-test-backend:
    runs-on: ubuntu-latest
    needs: install-and-test-frontend
    steps:
      - name: cloning code
        uses: actions/checkout@v4
        
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      
      - name: Install deps
        run: go mod download
        working-directory: backend
    
      - name: Install vet
        run: go vet
        working-directory: backend
        
      - name: Run tests
        run: go test -v ./...
        working-directory: backend

  docker:
    needs: [install-and-test-frontend,install-and-test-backend]
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    

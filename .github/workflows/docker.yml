name: Docker Build & Push

on:
  workflow_call:

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile-path: ['./frontend/Dockerfile', './backend/Dockerfile']
        context-path: ['./frontend', './backend']
        image-name: ['devboard-frontend', 'devboard-backend']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Images
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context-path }}
          file: ${{ matrix.dockerfile-path }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image-name }}:${{ github.sha }}

   